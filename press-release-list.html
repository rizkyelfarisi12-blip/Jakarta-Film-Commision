<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Press Release | Jakarta Film Commission</title>

  <link rel="icon" type="image/png" href="assets/icon/JakartaFilmCommissionLogo-9.ico">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

 <!-- internal resources -->
 <link rel="stylesheet" href="assets/css/custom.css">

</head>

<body>
  <!-- LOADER -->
  <div id="loader-container"></div>
  
  <!-- Hamburger Menu -->
  <div class="menu-overlay" id="menuOverlay"></div>

  <!-- WHATSAPP -->
  <!-- <div id="whatsapp-container"></div> -->
  
  <!-- NAVBAR -->
  <div id="navbar"></div>

  <!-- HERO -->
  <section class="press-release-hero">

    <div class="press-release-bg">
        <img src="gallery/cover/camera-take-person.webp" alt="">
    </div>

    <div class="press-release-overlay"></div>

    <div class="container">
        <div class="press-release-hero-content">

          <span class="press-release-label">
              Communications & Press
          </span>

          <h1>
              Press Releases
          </h1>

        </div>
    </div>

  </section>

  <!-- =========================
  PRESS RELEASE LIST
  ========================= -->
  <section class="section" style="background-color: #F8F0DF;">
    <div class="container">

      <!-- FILTER -->
      <div class="press-filter-wrapper">

        <div class="press-filters">

            <button class="press-filter filter-all active" data-filter="all">
                All Announcements
            </button>

            <button class="press-filter filter-official" data-filter="official">
                Official Release
            </button>

            <button class="press-filter filter-program" data-filter="program">
                Program Update
            </button>

            <button class="press-filter filter-industry" data-filter="industry">
                Industry News
            </button>

        </div>

        <div class="press-sort-dropdown">
          <button class="press-sort-trigger" id="sortTrigger">
              Sort: Newest
              <span>+</span>
          </button>
          <div class="press-sort-menu" id="sortMenu">

              <button class="sort-option active" data-sort="newest">
              Newest
              </button>

              <button class="sort-option" data-sort="oldest">
              Oldest
              </button>

          </div>
        </div>

      </div>

      <!-- LIST -->
      <div class="press-list" id="pressContainer"></div>

      <!-- LOAD MORE -->
      <div class="film-button-wrap">
        <button class="film-button" id="loadMoreBtn">
          Load More Updates
        </button>
      </div>

    </div>
  </section>

  <!-- FOOTER -->
  <div id="footer"></div>
 
</body>

<!-- JAVASCRIPT -->
  <script src="assets/js/components.js"></script> 
  <script src="assets/js/custom.js"></script>
  <script src="assets/js/press-release.js"></script>
  <script src="assets/data/press-release-data.js"></script>

  <script>
    let visibleCount = 5;
    let currentFilter = "all";
    let currentSort = "newest";

    function loadPressReleases(){
      renderPress();
    }

    function renderPress(){

      const container =
        document.getElementById("pressContainer");

      const loadBtn =
        document.getElementById("loadMoreBtn");

      container.innerHTML = "";

      let filtered = [...pressData];

      // FILTER
      if(currentFilter !== "all"){
        filtered = filtered.filter(item =>
          item.category.toLowerCase().includes(currentFilter)
        );
      }

      // SORT
      filtered.sort((a,b)=>{

        const dateA = new Date(a.date);
        const dateB = new Date(b.date);

        return currentSort === "newest"
          ? dateB - dateA
          : dateA - dateB;

      });

      // RENDER
      filtered.slice(0, visibleCount).forEach(item => {
        container.innerHTML += `
        <article class="press-list-card ${getCategoryClass(item.category)}">
          <div class="press-list-image">
              <img src="${item.image}" alt="${item.title}">
          </div>

          <div class="press-list-content">

            <div class="press-list-top">
                <span class="press-list-category">
                    ${item.category}
                </span>
                <span class="press-list-date">
                    ${formatDate(item.date)}
                </span>
            </div>

            <h2 class="press-list-title">
                ${item.title}
            </h2>

            <p class="press-list-desc">
                ${limitText(item.description, 180)}
            </p>

            <a
                href="press-release.html?slug=${generateSlug(item.title)}"
                class="press-list-link">
                Read Full Announcement →
            </a>

          </div>
        </article>
        `;
    });

      // HIDE LOAD MORE IF NOT NEEDED
      if(filtered.length <= visibleCount){
        loadBtn.style.display = "none";
      }else{
        loadBtn.style.display = "inline-flex";
      }

    }

    document
    .getElementById("loadMoreBtn")
    .addEventListener("click", () => {

      visibleCount += 5;

      renderPress();

    });

    loadPressReleases();

    /* FILTER BUTTON */
    document.addEventListener("click", e => {

      if(e.target.classList.contains("press-filter")){

        document
          .querySelectorAll(".press-filter")
          .forEach(btn => btn.classList.remove("active"));

        e.target.classList.add("active");
        currentFilter = e.target.dataset.filter;

        visibleCount = 5;
        renderPress();
      }

    });

    /* SORT DROPDOWN */
    const sortTrigger =
      document.getElementById("sortTrigger");

    const sortMenu =
      document.getElementById("sortMenu");


    /* OPEN DROPDOWN */
    sortTrigger.addEventListener("click", () => {
      sortMenu.classList.toggle("active");
    });

    /* SORT OPTION */
    document.addEventListener("click", e => {
      if(e.target.classList.contains("sort-option")){
        document
          .querySelectorAll(".sort-option")
          .forEach(btn => btn.classList.remove("active"));
        e.target.classList.add("active");

        currentSort = e.target.dataset.sort;

        sortTrigger.innerHTML = `
          Sort: ${e.target.textContent}
          <span>+</span>
        `;

        sortMenu.classList.remove("active");
        visibleCount = 5;
        renderPress();
      }
    });

    /* CLOSE DROPDOWN */
    document.addEventListener("click", e => {
      if(!e.target.closest(".press-sort-dropdown")){

        sortMenu.classList.remove("active");

      }
    });

  </script>
  
</html>
