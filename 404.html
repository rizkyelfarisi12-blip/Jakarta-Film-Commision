<!DOCTYPE html>
<html>
<head>

<title>Page Not Found</title>

<link rel="stylesheet" href="assets/css/custom.css">

<style>
    .notfound{

    min-height:100vh;

    background:url(
    'assets/images/cinema-bg.jpg'
    ) center center/cover;

    position:relative;

    display:flex;
    justify-content:center;
    align-items:center;

}

.overlay{

    position:absolute;
    inset:0;

    background:
    rgba(0,0,0,.75);

}

.content{

    position:relative;
    z-index:2;

    text-align:center;
    color:white;

}

.content h1{

    font-size:180px;
    margin:0;
    line-height:1;

}

.content h2{

    font-size:42px;

}

.content p{

    max-width:500px;
    margin:auto;

    opacity:.8;

}

.content a{

    display:inline-block;

    margin-top:30px;

    padding:14px 30px;

    background:#fff;
    color:#000;

    text-decoration:none;
    border-radius:50px;

}
</style>
</head>

<body>

<div class="notfound">

    <div class="overlay"></div>

    <div class="content">

        <h1>404</h1>

        <h2>Scene Not Found</h2>

        <p>
            The location you're looking for
            is no longer in production.
        </p>

        <a href="index.html">
            Back To Homepage
        </a>

    </div>

</div>

</body>
</html>
