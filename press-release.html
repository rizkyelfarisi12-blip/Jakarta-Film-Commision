<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Jakarta Film Commission</title>

  <link rel="icon" type="image/png" href="assets/icon/JakartaFilmCommissionLogo-9.ico">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

 <!-- internal resources -->
 <link rel="stylesheet" href="assets/css/custom.css">

</head>

<body>
  <!-- LOADER -->
  <div id="loader-container"></div>
  
  <!-- Hamburger Menu -->
  <div class="menu-overlay" id="menuOverlay"></div>

  <!-- WHATSAPP -->
  <!-- <div id="whatsapp-container"></div> -->
  
  <!-- NAVBAR -->
  <div id="navbar"></div>

  <!-- =========================
  PRESS RELEASE HERO
  ========================= -->
  <section class="press-release-hero">

    <!-- BG -->
    <div class="press-release-bg">
      <img src="https://images.unsplash.com/photo-1512453979798-5ea266f8880c?q=80&w=1800&auto=format&fit=crop" alt="">
      <div class="press-release-overlay"></div>
    </div>

    <div class="container">
      <div class="press-release-hero-content">
        <span class="press-release-label" id="pressCategory"></span>
        <h1 id="heroPressTitle"></h1>
      </div>
    </div>

  </section>

  <!-- =========================
  press-release CONTENT
  ========================= -->
  <section class="press-release-section">
    <div class="container">

      <!-- Breadcrumb -->
      <nav class="press-breadcrumb">
        <a href="index.html">Home</a>
        <span>/</span>
        <a href="press-release-list.html">Press Releases</a>
        <span>/</span>
        <span id="breadcrumbTitle"></span>
      </nav>

      <div class="press-meta">
        <span class="meta-category" id="pressCategoryMeta"></span>
        <span class="meta-dot"></span>
        <span id="pressDate"></span>
        <span class="meta-dot"></span>
        <span id="pressReadTime"></span>
      </div>

      <div class="press-layout">
        <!-- LEFT -->
        <div class="press-main">

          <div class="press-featured-image">
              <img id="pressImage" src="" alt="">
          </div>

          <div class="press-release-heading">
              <div class="press-release-line"></div>
              <h2 id="pressTitle"></h2>
          </div>
          <div
              id="pressContent"
              class="press-release-content">
          </div>
          
        </div>

        <!-- RIGHT -->
        <aside class="press-sidebar">
          <div class="sidebar-latest">
            <h3 class="sidebar-title">
                Latest Press
            </h3>
            <div id="latestPressSidebar"></div>
            <a
                href="press-release-list.html"
                class="sidebar-more">
                See All Press Releases →
            </a>
          </div>
        </aside>

      </div>

    </div>
</section>
  
  <!-- FOOTER -->
  <div id="footer"></div>

</body>

<!-- JAVASCRIPT -->
  <script src="assets/js/components.js"></script>
  <script src="assets/js/custom.js"></script>
  <script src="assets/js/press-release.js"></script>

<!-- DATA -->
<script src="assets/data/press-release-data.js"></script>

  <script>
    function loadPressDetail(){

      // ambil slug URL
      const params = new URLSearchParams(window.location.search);
      const slug = params.get("slug");

      // cari data dari pressData.js
      const press = pressData.find(item =>
        generateSlug(item.title) === slug
      );

      // kalau tidak ketemu
      if(!press){

        document.getElementById("heroPressTitle").textContent =
          "Press Release Not Found";

        document.getElementById("pressTitle").textContent =
          "Press Release Not Found";

        return;
      }

      // HERO TITLE
      document.getElementById("heroPressTitle").textContent =
        press.title;

      // TITLE
      document.getElementById("pressTitle").textContent =
        press.title;

      // TIME
      document.getElementById("pressReadTime").textContent =
        calculateReadTime(press.content);

      document.getElementById("breadcrumbTitle").textContent =
        limitText(press.title,40);

      // CATEGORY
      document.getElementById("pressCategory").textContent =
        press.category;

      // DATE
      document.getElementById("pressDate").textContent =
        formatDate(press.date);

      // IMAGE
      document.getElementById("pressImage").src =
        press.image;

      // CONTENT
      const content =
        document.getElementById("pressContent");

      content.innerHTML = "";

      press.content.forEach(paragraph => {

        content.innerHTML += `
          <p>${paragraph}</p>
        `;

      });

      // browser title
      document.title =
        press.title + " | Jakarta Film Commission";

      const sidebar =
      document.getElementById("latestPressSidebar");

      sidebar.innerHTML = "";

      const latestPress = [...pressData]

      .sort((a,b)=>new Date(b.date)-new Date(a.date))

      .filter(item=>generateSlug(item.title)!==slug)

      .slice(0,3);

      latestPress.forEach(item=>{

          sidebar.innerHTML += `

          <a href="press-release.html?slug=${generateSlug(item.title)}"
            class="sidebar-card-press ${getCategoryClass(item.category)}">

              <img src="${item.image}" alt="${item.title}">

              <div class="sidebar-card-body">

                  <span class="sidebar-category">

                      ${item.category}

                  </span>

                  <h4>

                      ${limitText(item.title,55)}

                  </h4>

                  <small>

                      ${formatDate(item.date)}

                  </small>

              </div>

          </a>

          `;

      });

    }

    loadPressDetail();

  </script>
</html>
