        /* =========================================================
           ESCAPE HTML
        ========================================================= */
        function escapeHtml(value) {

            if (value === null || value === undefined) {
                return "";
            }

            return String(value)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");

        }

        /* =========================================================
           RICH TEXT SANITIZER

           Paragraph content dari admin form disimpan sebagai HTML
           (hasil rich-text editor). Fungsi ini membersihkan HTML
           tersebut sebelum ditampilkan:

           - Hanya tag <b> <strong> <i> <em> <u> <a> <br> yang
             dipertahankan.
           - Semua atribut dibuang, kecuali href/target/rel pada
             <a> (dan hanya jika href berupa http/https).
           - Ini juga membersihkan konten lama yang mungkin masih
             menyimpan inline style berantakan dari hasil paste
             Word/Google Docs sebelum paste-sanitizer dipasang di
             admin.
        ========================================================= */
        const RICHTEXT_ALLOWED_TAGS = new Set([
            "B", "STRONG", "I", "EM", "U", "A", "BR"
        ]);

        function sanitizeRichText(html) {

            const wrapper =
                document.createElement("div");

            wrapper.innerHTML =
                html || "";

            function walk(node) {

                Array.from(node.childNodes).forEach(child => {

                    if (child.nodeType === Node.ELEMENT_NODE) {

                        walk(child);

                        if (!RICHTEXT_ALLOWED_TAGS.has(child.tagName)) {

                            while (child.firstChild) {
                                node.insertBefore(child.firstChild, child);
                            }

                            node.removeChild(child);
                            return;

                        }

                        if (child.tagName === "A") {

                            const href =
                                child.getAttribute("href") || "";

                            Array.from(child.attributes).forEach(attr =>
                                child.removeAttribute(attr.name)
                            );

                            if (/^https?:\/\//i.test(href)) {
                                child.setAttribute("href", href);
                                child.setAttribute("target", "_blank");
                                child.setAttribute("rel", "noopener noreferrer");
                            } else {
                                while (child.firstChild) {
                                    node.insertBefore(child.firstChild, child);
                                }
                                node.removeChild(child);
                            }

                        } else {

                            Array.from(child.attributes).forEach(attr =>
                                child.removeAttribute(attr.name)
                            );

                        }

                    } else if (
                        child.nodeType !== Node.TEXT_NODE
                    ) {

                        node.removeChild(child);

                    }

                });

            }

            walk(wrapper);

            return wrapper.innerHTML;

        }

        /* =========================================================
           CATEGORY
        ========================================================= */
        function getCategoryClass(category) {
            if (!category) {
                return "category-others";
            }

            const normalized =
                String(category)
                    .toLowerCase()
                    .trim()
                    .replace(/\s+/g, "-")
                    .replace(
                        /[^a-z0-9-]/g,
                        ""
                    );

            switch (normalized) {

                case "nonton-di":
                    return "category-nonton-di";

                case "nonton-bareng":
                    return "category-nonton-bareng";

                case "jakarta-film-lab":
                    return "category-jakarta-film-lab";

                default:
                    return "category-others";

            }

        }

        /* =========================================================
           CATEGORY COLOR
        ========================================================= */
        function getCategoryColor(category) {

            if (!category) {
                return "#97B300";
            }

            const normalized =
                String(category)
                    .toLowerCase()
                    .trim()
                    .replace(/\s+/g, "-")
                    .replace(
                        /[^a-z0-9-]/g,
                        ""
                    );

            switch (normalized) {

                case "nonton-di":
                    return "#FF6A14";

                case "nonton-bareng":
                    return "#DA291C";

                case "jakarta-film-lab":
                    return "#526E3E";

                default:
                    return "#97B300";

            }

        }

        /* =========================================================
           FORMAT DATE
        ========================================================= */
        function formatDate(dateString) {
            if (!dateString) {
                return "";
            }

            const date =
                new Date(
                    dateString + "T00:00:00"
                );

            if (
                isNaN(
                    date.getTime()
                )
            ) {
                return dateString;
            }

            return date.toLocaleDateString(
                "en-US",
                {
                    day: "numeric",
                    month: "short",
                    year: "numeric"
                }
            );

        }

        /* =========================================================
           LOAD EVENT
        ========================================================= */
        async function loadEvent() {
            try {
                if (!slug) {
                    return;
                }

                /* ============================================
                   API
                ============================================ */
                const response =
                    await fetch(
                        `api/events/get-event-detail.php?slug=${encodeURIComponent(slug)}`
                    );

                if (!response.ok) {
                    throw new Error(
                        "Failed to fetch event"
                    );
                }

                const currentEvent =
                    await response.json();

                console.log(
                    "EVENT DETAIL:",
                    currentEvent
                );

                /* ============================================
                   API ERROR
                ============================================ */
                if (
                    !currentEvent ||
                    currentEvent.success === false
                ) {
                    throw new Error(
                        currentEvent?.message ||
                        "Event not found"
                    );
                }

                /* ============================================
                   CATEGORY
                ============================================ */
                const category =
                    currentEvent.category ||
                    "Others";

                const categoryDisplay =
                    currentEvent.category_display ||
                    (
                        category === "Others"
                        ? currentEvent.category_name
                        : category
                    ) ||
                    "Others";

                const categoryClass =
                    getCategoryClass(
                        category
                    );

                const categoryColor =
                    getCategoryColor(
                        category
                    );

                eventCategory.textContent =
                    categoryDisplay;

                eventCategory.classList.add(
                    categoryClass
                );

                document.documentElement
                    .style
                    .setProperty(
                        "--event-category-color",
                        categoryColor
                    );

                /* ============================================
                TITLE
                ============================================ */
                const title =
                    String(
                        currentEvent.title || ""
                    ).trim() || "Untitled Event";

                const metaTitle =
                    String(
                        currentEvent.meta_title || ""
                    ).trim();

                const pageTitle =
                    metaTitle ||
                    `${title} | Jakarta Film Commission`;

                eventTitle.textContent =
                    title;

                document.title =
                    pageTitle;

                /* ============================================
                BREADCRUMB
                ============================================ */

                if (eventBreadcrumbTitle) {

                    eventBreadcrumbTitle.textContent =
                        title;

                }


                /* ============================================
                META CATEGORY
                ============================================ */

                if (eventMetaCategory) {

                    eventMetaCategory.textContent =
                        categoryDisplay;

                }


                /* ============================================
                CATEGORY COLOR
                ============================================ */

                if (eventMetaCategory) {

                    eventMetaCategory.classList.add(
                        categoryClass
                    );

                }

                const description =
                    String(
                        currentEvent.meta_description ||
                        currentEvent.description ||
                        ""
                    ).trim();

                if (metaDescription) {

                    metaDescription.content =
                        description ||
                        `${title} - Jakarta Film Commission.`;

                }

                const canonical =
                    window.location.origin +
                    window.location.pathname +
                    "?slug=" +
                    encodeURIComponent(slug);

                if (canonicalUrl) {

                    canonicalUrl.href =
                        canonical;

                }

                if (ogUrl) {

                    ogUrl.content =
                        canonical;

                }

                const dateText =
                    formatEventDate(
                        currentEvent.start_date,
                        currentEvent.end_date
                    );

                eventDate.innerHTML = `
                    <span class="event-date-icon">
                        <img
                            src="assets/icon/date.png"
                            alt="Date"
                        >
                    </span>

                    ${escapeHtml(dateText)}
                `;


                /* CONTENT META DATE */

                if (eventMetaDate) {

                    eventMetaDate.textContent =
                        dateText;

                }

            sidebarDate.textContent =
                dateText;

            /* ============================================
            TIME
            ============================================ */
            const timeText =
                formatEventTime(
                    currentEvent.start_time,
                    currentEvent.end_time
                );

            eventTime.textContent =
                timeText;

            /* ============================================
                LOCATION
            ============================================ */
            const location =
                currentEvent.location ||
                "Location TBA";

            const address =
                currentEvent.address ||
                "";

            eventLocation.innerHTML = `
                <span class="location-icon"><img src="assets/icon/pin.png" alt="Location"></span>
                ${escapeHtml(location)}
            `;

            sidebarLocation.textContent =
                location;

            sidebarAddress.textContent =
                address ||
                "Address TBA";

            /* ============================================
                COVER IMAGE
            ============================================ */

            eventCover.onerror = function () {
                this.closest(".event-detail-bg")?.classList.add("event-cover-broken");
                this.style.display = "none";
            };

            if (
                currentEvent.cover_image &&
                currentEvent.cover_image !== "undefined"
            ) {

                eventCover.src =
                    currentEvent.cover_image;


                /* FEATURED IMAGE */

                if (eventFeaturedImage) {

                    eventFeaturedImage.src =
                        currentEvent.cover_image;

                    eventFeaturedImage.alt =
                        title;

                }


                /* OG IMAGE */

                const imageUrl =
                    new URL(
                        currentEvent.cover_image,
                        window.location.href
                    ).href;

                if (ogImage) {

                    ogImage.content =
                        imageUrl;

                }

            }

            if (ogTitle) {

                ogTitle.content =
                    pageTitle;

            }

            if (ogDescription) {

                ogDescription.content =
                    description;

            }

            /* ============================================
            EVENT STRUCTURED DATA
            ============================================ */
            generateEventSchema(
                currentEvent,
                canonical
            );

            eventCover.alt =
                currentEvent.title ||
                "Event";

            /* ============================================
                MAP
            ============================================ */
            if (
                currentEvent.map_url
            ) {

                mapsLink.href =
                    currentEvent.map_url;

                mapsLink.style.display =
                    "inline-flex";

            } else {

                mapsLink.style.display =
                    "none";

            }

            /* ============================================
                CONTENT
            ============================================ */
            eventContent.innerHTML =
                "";

            let content = [];

            if (
                currentEvent.content
            ) {
                try {

                    content =
                        JSON.parse(
                            currentEvent.content
                        );

                } catch (error) {

                    console.error(
                        "CONTENT JSON ERROR:",
                        error
                    );

                    content = [
                        currentEvent.content
                    ];

                }
            }

            if (
                Array.isArray(content) &&
                content.length
            ) {
            content.forEach(block => {

                /* =========================================
                PARAGRAPH
                ========================================= */
                if (
                    block &&
                    block.type === "paragraph"
                ) {

                    const p =
                        document.createElement("p");

                    /*
                    | block.text berisi HTML (hasil rich-text
                    | editor di admin), jadi harus dirender
                    | dengan innerHTML setelah disanitasi -
                    | bukan textContent (yang akan menampilkan
                    | tag HTML sebagai teks mentah).
                    */
                    p.innerHTML =
                        sanitizeRichText(block.text || "");

                    eventContent.appendChild(p);

                }

                /* =========================================
                IMAGE
                ========================================= */
                if (
                    block &&
                    block.type === "image"
                ) {

                    const figure =
                        document.createElement("figure");

                    figure.className =
                        "event-article-image";

                    const img =
                        document.createElement("img");

                    img.src =
                        block.src;

                    img.alt =
                        block.alt ||
                        "";

                    img.loading =
                        "lazy";

                    img.onerror =
                        function () {
                            this.closest("figure")?.classList.add("event-article-image-broken");
                            this.style.display = "none";
                        };

                    figure.appendChild(img);

                    /* =====================================
                    CAPTION
                    ===================================== */
                    if (block.caption) {

                        const caption =
                            document.createElement(
                                "figcaption"
                            );

                        caption.textContent =
                            block.caption;

                        figure.appendChild(
                            caption
                        );

                    }

                    eventContent.appendChild(
                        figure
                    );

                }

            });

            } else {

                eventContent.innerHTML = `
                    <p>
                        No event description available.
                    </p>
                `;

            }

            /* ============================================
                SCHEDULE
            ============================================ */
            scheduleList.innerHTML = "";

            let schedules = [];

            /* ============================================
                PARSE SCHEDULE
            ============================================ */
            if (currentEvent.schedule) {

                try {

                    schedules =
                        JSON.parse(
                            currentEvent.schedule
                        );

                } catch (error) {

                    console.error(
                        "SCHEDULE JSON ERROR:",
                        error
                    );

                    schedules = [];

                }

            }

            /* ============================================
                HAS SCHEDULE
            ============================================ */
            if (
                Array.isArray(schedules) &&
                schedules.length > 0
            ) {

                schedules.forEach(
                    item => {

                        const scheduleItem =
                            document.createElement(
                                "div"
                            );

                        scheduleItem.className =
                            "schedule-item";

                        scheduleItem.innerHTML = `

                            <div class="schedule-time">
                                ${escapeHtml(item.time || "TBA")}
                            </div>

                            <div class="schedule-content">

                                <h3>
                                    ${escapeHtml(item.title || "Coming Soon")}
                                </h3>

                                <p>
                                    ${escapeHtml(item.description || "")}
                                </p>

                            </div>

                        `;

                        scheduleList.appendChild(
                            scheduleItem
                        );

                    }
                );

                /*
                |------------------------------------------
                | SHOW SCHEDULE
                |------------------------------------------
                */
                scheduleSection.style.display = "";

                } else {

                    /* =========================================
                        NO SCHEDULE
                    ========================================= */
                    scheduleList.innerHTML = `

                        <div class="schedule-empty">

                            <div class="schedule-empty-icon">
                                <img src="assets/icon/date.png" alt="">
                            </div>

                            <h3>
                                Coming Soon
                            </h3>

                            <p>
                                The event schedule will be announced soon.
                            </p>

                        </div>

                    `;

                    // KEEP SECTION VISIBLE
                    scheduleSection.style.display =
                        "";

                }

            } catch (error) {

                console.error(
                    "EVENT DETAIL:",
                    error
                );

                eventTitle.textContent =
                    "Event Not Found";

                eventContent.innerHTML = `

                    <p>
                        Unable to load this event.
                    </p>

                `;

                scheduleSection.style.display =
                    "none";

            }

        }

        function generateEventSchema(
            event,
            canonicalUrl
        ) {

            if (!event) {
                return;
            }

            // CATEGORY DISPLAY
            const category =
                event.category_display ||
                (
                    event.category === "Others"
                        ? event.category_name
                        : event.category
                ) ||
                "Others";

            // SCHEMA
            const schema = {

                "@context":
                    "https://schema.org",

                "@type":
                    "Event",

                "name":
                    event.title ||
                    "Untitled Event",

                "description":
                    event.meta_description ||
                    event.description ||
                    "",

                "url":
                    canonicalUrl,

                "image":
                    (event.cover_image && event.cover_image !== "undefined")
                        ? [
                            new URL(
                                event.cover_image,
                                window.location.href
                            ).href
                        ]
                        : [],

                "startDate":
                    event.start_date
                        ? `${event.start_date}T${event.start_time || "00:00:00"}`
                        : undefined,

                "endDate":
                    event.end_date
                        ? `${event.end_date}T${event.end_time || "23:59:59"}`
                        : undefined,

                "eventStatus":
                    "https://schema.org/EventScheduled",

                "eventAttendanceMode":
                    "https://schema.org/OfflineEventAttendanceMode",

                "location": {

                    "@type":
                        "Place",

                    "name":
                        event.location ||
                        "Jakarta",

                    "address": {

                        "@type":
                            "PostalAddress",

                        "streetAddress":
                            event.address ||
                            "",

                        "addressLocality":
                            "Jakarta",

                        "addressCountry":
                            "ID"

                    }

                },

                "organizer": {

                    "@type":
                        "Organization",

                    "name":
                        "Jakarta Film Commission"

                },

                // CATEGORY
                "about": {

                    "@type":
                        "Thing",

                    "name":
                        category

                }

            };

            // REMOVE UNDEFINED
            Object.keys(schema)
                .forEach(
                    key => {

                        if (
                            schema[key] ===
                            undefined
                        ) {
                            delete schema[key];
                        }

                    }
                );


            // REMOVE OLD EVENT SCHEMA            
            const oldSchema =
                document.getElementById(
                    "eventStructuredData"
                );

            if (oldSchema) {
                oldSchema.remove();
            }

            // CREATE SCHEMA
            const script =
                document.createElement(
                    "script"
                );

            script.type =
                "application/ld+json";

            script.id =
                "eventStructuredData";

            script.textContent =
                JSON.stringify(
                    schema
                );

            document.head.appendChild(
                script
            );

        }

        function formatEventTime(startTime, endTime) {

            if (!startTime) {
                return "Time TBA";
            }

            const formatTime = time => {

                if (!time) {
                    return "";
                }

                return String(time).substring(0, 5);

            };

            const start = formatTime(startTime);
            const end = formatTime(endTime);

            if (start && end) {
                return `${start} - ${end}`;
            }

            if (start) {
                return start;
            }

            return "Time TBA";
        }

        function formatEventDate(startDate, endDate) {

            //  NO START DATE
            if (!startDate) {
                return "TBA";
            }

            // DATE FORMAT
            const options = {

                day: "2-digit",
                month: "short",
                year: "numeric"

            };

            //  START DATE
           
            const start =
                new Date(
                    startDate + "T00:00:00"
                );

            if (isNaN(start.getTime())) {
                return "TBA";
            }

            const startText =
                start.toLocaleDateString(
                    "en-GB",
                    options
                );

            // NO END DATE
            // Event hanya satu hari.
            if (!endDate) {
                return startText;
            }

            // SAME DATE
            if (startDate === endDate) {
                return startText;
            }

            // END DATE            
            const end =
                new Date(
                    endDate + "T00:00:00"
                );

            if (isNaN(end.getTime())) {
                return startText;
            }

            const endText =
                end.toLocaleDateString(
                    "en-GB",
                    options
                );

            //  DATE RANGE            
            return `${startText} - ${endText}`;
        }

        /* =========================================================
           START
        ========================================================= */
        loadEvent();
