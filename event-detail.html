<!-- =====================================================
     FOOTER
===================================================== -->

<div id="footer"></div>



<!-- =====================================================
     JAVASCRIPT
===================================================== -->

<script src="assets/js/components.js"></script>

<script src="assets/js/custom.js"></script>



<script>

/* =========================================================
   EVENT DETAIL
========================================================= */


/* =========================================================
   GET SLUG
========================================================= */

const urlParams =
    new URLSearchParams(
        window.location.search
    );


const slug =
    urlParams.get("slug");


console.log(
    "EVENT SLUG:",
    slug
);



/* =========================================================
   ELEMENTS
========================================================= */

const eventTitle =
    document.getElementById(
        "eventTitle"
    );


const eventCategory =
    document.getElementById(
        "eventCategory"
    );


const eventDate =
    document.getElementById(
        "eventDate"
    );


const eventLocation =
    document.getElementById(
        "eventLocation"
    );


const eventCover =
    document.getElementById(
        "eventCover"
    );


const eventContent =
    document.getElementById(
        "eventContent"
    );


const scheduleList =
    document.getElementById(
        "scheduleList"
    );


const scheduleSection =
    document.getElementById(
        "scheduleSection"
    );


const sidebarDate =
    document.getElementById(
        "sidebarDate"
    );


const eventTime =
    document.getElementById(
        "eventTime"
    );


const sidebarLocation =
    document.getElementById(
        "sidebarLocation"
    );


const sidebarAddress =
    document.getElementById(
        "sidebarAddress"
    );


const mapsLink =
    document.getElementById(
        "mapsLink"
    );


/* =========================================================
   CHECK SLUG
========================================================= */

if(!slug){

    document.body.innerHTML = `

        <div style="
            padding:100px 30px;
            text-align:center;
        ">

            <h1>
                Event Not Found
            </h1>

            <p>
                No event slug was provided.
            </p>

        </div>

    `;

}


/* =========================================================
   CATEGORY
========================================================= */

function getCategoryClass(category){

    if(!category){

        return "category-others";

    }


    const normalized =
        String(category)
            .toLowerCase()
            .trim()
            .replace(/\s+/g, "-")
            .replace(
                /[^a-z0-9-]/g,
                ""
            );


    switch(normalized){

        case "nonton-di":

            return "category-nonton-di";


        case "nonton-bareng":

            return "category-nonton-bareng";


        case "jakarta-film-lab":

            return "category-jakarta-film-lab";


        default:

            return "category-others";

    }

}


/* =========================================================
   CATEGORY COLOR
========================================================= */

function getCategoryColor(category){

    if(!category){

        return "#97B300";

    }


    const normalized =
        String(category)
            .toLowerCase()
            .trim()
            .replace(/\s+/g, "-")
            .replace(
                /[^a-z0-9-]/g,
                ""
            );


    switch(normalized){

        case "nonton-di":

            return "#FF6A14";


        case "nonton-bareng":

            return "#DA291C";


        case "jakarta-film-lab":

            return "#526E3E";


        default:

            return "#97B300";

    }

}


/* =========================================================
   FORMAT DATE
========================================================= */

function formatDate(dateString){

    if(!dateString){

        return "";

    }


    const date =
        new Date(
            dateString + "T00:00:00"
        );


    if(
        isNaN(
            date.getTime()
        )
    ){

        return dateString;

    }


    return date.toLocaleDateString(
        "en-US",
        {
            day:"numeric",
            month:"short",
            year:"numeric"
        }
    );

}


/* =========================================================
   LOAD EVENT
========================================================= */

async function loadEvent(){

    try{


        if(!slug){

            return;

        }


        /* ============================================
           API
        ============================================ */

        const response =
            await fetch(
                `api/events/get-event-detail.php?slug=${encodeURIComponent(slug)}`
            );


        if(!response.ok){

            throw new Error(
                "Failed to fetch event"
            );

        }


        const currentEvent =
            await response.json();


        console.log(
            "EVENT DETAIL:",
            currentEvent
        );


        /* ============================================
           API ERROR
        ============================================ */

        if(
            !currentEvent ||
            currentEvent.success === false
        ){

            throw new Error(
                currentEvent?.message ||
                "Event not found"
            );

        }


        /* ============================================
           CATEGORY
        ============================================ */

        const category =
            currentEvent.category ||
            "Others";


        const categoryClass =
            getCategoryClass(
                category
            );


        const categoryColor =
            getCategoryColor(
                category
            );


        eventCategory.textContent =
            category;


        eventCategory.classList.add(
            categoryClass
        );


        document.documentElement
            .style
            .setProperty(
                "--event-category-color",
                categoryColor
            );


        /* ============================================
           TITLE
        ============================================ */

        eventTitle.textContent =
            currentEvent.title ||
            "Untitled Event";


        /* ============================================
           DATE
        ============================================ */

        const dateText =
            formatEventDate(
                currentEvent.start_date,
                currentEvent.end_date
            );


        eventDate.innerHTML = `
            <span>📅</span>
            ${dateText}
        `;


        sidebarDate.textContent =
            dateText;


        /* ============================================
        TIME
        ============================================ */

        const timeText =
            formatEventTime(
                currentEvent.start_time,
                currentEvent.end_time
            );

        eventTime.textContent =
            timeText;

        /* ============================================
           LOCATION
        ============================================ */

        const location =
            currentEvent.location ||
            "Location TBA";


        const address =
            currentEvent.address ||
            "";


        eventLocation.innerHTML = `
            <span>📍</span>
            ${location}
        `;


        sidebarLocation.textContent =
            location;


        sidebarAddress.textContent =
            address ||
            "Address not specified";


        /* ============================================
           COVER IMAGE
        ============================================ */

        if(
            currentEvent.cover_image
        ){

            eventCover.src =
                currentEvent.cover_image;

        }


        eventCover.alt =
            currentEvent.title ||
            "Event";


        /* ============================================
           MAP
        ============================================ */

        if(
            currentEvent.map_url
        ){

            mapsLink.href =
                currentEvent.map_url;

            mapsLink.style.display =
                "inline-flex";

        }else{

            mapsLink.style.display =
                "none";

        }


        /* ============================================
           CONTENT
        ============================================ */

        eventContent.innerHTML =
            "";


        let content = [];


        if(
            currentEvent.content
        ){

            try{

                content =
                    JSON.parse(
                        currentEvent.content
                    );

            }catch(error){

                console.error(
                    "CONTENT JSON ERROR:",
                    error
                );


                content = [
                    currentEvent.content
                ];

            }

        }


        if(
            Array.isArray(content) &&
            content.length
        ){

            content.forEach(block => {

                if(block.type === "paragraph"){

                    const p = document.createElement("p");

                    p.textContent = block.text;

                    eventContent.appendChild(p);

                }

                if(block.type === "image"){

                    const figure = document.createElement("figure");

                    const img = document.createElement("img");

                    img.src = ROOT_PATH + "/" + block.src;

                    img.alt = block.alt || "";

                    figure.appendChild(img);

                    if(block.caption){

                        const caption =
                            document.createElement("figcaption");

                        caption.textContent =
                            block.caption;

                        figure.appendChild(caption);

                    }

                    eventContent.appendChild(figure);

                }

            });

        }else{

            eventContent.innerHTML = `
                <p>
                    No event description available.
                </p>
            `;

        }


        /* ============================================
           SCHEDULE
        ============================================ */

        scheduleList.innerHTML =
            "";


        let schedules = [];


        if(
            currentEvent.schedule
        ){

            try{

                schedules =
                    JSON.parse(
                        currentEvent.schedule
                    );

            }catch(error){

                console.error(
                    "SCHEDULE JSON ERROR:",
                    error
                );

            }

        }


        if(
            Array.isArray(schedules) &&
            schedules.length
        ){

            schedules.forEach(
                item => {

                    const scheduleItem =
                        document.createElement(
                            "div"
                        );


                    scheduleItem.className =
                        "schedule-item";


                    scheduleItem.innerHTML = `

                        <div class="schedule-time">
                            ${item.time || ""}
                        </div>

                        <div class="schedule-content">

                            <h3>
                                ${item.title || ""}
                            </h3>

                            <p>
                                ${item.description || ""}
                            </p>

                        </div>

                    `;


                    scheduleList.appendChild(
                        scheduleItem
                    );

                }
            );


            scheduleSection.style.display =
                "";

        }else{

            scheduleSection.style.display =
                "none";

        }


    }catch(error){


        console.error(
            "EVENT DETAIL:",
            error
        );


        eventTitle.textContent =
            "Event Not Found";


        eventContent.innerHTML = `

            <p>
                Unable to load this event.
            </p>

        `;


        scheduleSection.style.display =
            "none";

    }

}
function formatEventTime(startTime, endTime){

    if(!startTime){
        return "Time TBA";
    }

    const formatTime = time => {

        if(!time){
            return "";
        }

        return String(time).substring(0,5);

    };

    const start = formatTime(startTime);
    const end   = formatTime(endTime);

    if(start && end){
        return `${start} - ${end}`;
    }

    if(start){
        return start;
    }

    return "Time TBA";
}

function formatEventDate(startDate, endDate){

    /*
    |--------------------------------------------------------------------------
    | NO START DATE
    |--------------------------------------------------------------------------
    */

    if(!startDate){

        return "TBA";

    }


    /*
    |--------------------------------------------------------------------------
    | DATE FORMAT
    |--------------------------------------------------------------------------
    */

    const options = {

        day: "2-digit",
        month: "short",
        year: "numeric"

    };


    /*
    |--------------------------------------------------------------------------
    | START DATE
    |--------------------------------------------------------------------------
    */

    const start =
        new Date(
            startDate + "T00:00:00"
        );


    if(isNaN(start.getTime())){

        return "TBA";

    }


    const startText =
        start.toLocaleDateString(
            "en-GB",
            options
        );


    /*
    |--------------------------------------------------------------------------
    | NO END DATE
    |--------------------------------------------------------------------------
    |
    | Event hanya satu hari.
    |
    */

    if(!endDate){

        return startText;

    }


    /*
    |--------------------------------------------------------------------------
    | SAME DATE
    |--------------------------------------------------------------------------
    */

    if(startDate === endDate){

        return startText;

    }


    /*
    |--------------------------------------------------------------------------
    | END DATE
    |--------------------------------------------------------------------------
    */

    const end =
        new Date(
            endDate + "T00:00:00"
        );


    if(isNaN(end.getTime())){

        return startText;

    }


    const endText =
        end.toLocaleDateString(
            "en-GB",
            options
        );


    /*
    |--------------------------------------------------------------------------
    | DATE RANGE
    |--------------------------------------------------------------------------
    */

    return `${startText} - ${endText}`;

}

/* =========================================================
   START
========================================================= */

loadEvent();

</script>


</body>

</html>
